name: Build and deploy KnowledgeBridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: false
      - name: Reassemble application source
        shell: bash
        run: |
          cat .deploy-source/part-*.b64 | base64 --decode > /tmp/knowledgebridge.tar.gz
          mkdir -p app
          tar -xzf /tmp/knowledgebridge.tar.gz --strip-components=1 -C app
          touch app/.nojekyll
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run automated tests
        working-directory: app
        run: npm test
      - name: Build production bundle
        working-directory: app
        run: npm run build
      - name: Ensure Pages compatibility
        run: touch app/dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
